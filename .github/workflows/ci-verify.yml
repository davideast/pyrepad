
name: Pyrepad CI ⚡

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: Build & Test (Bun)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install --no-cache || npm install --force

      - name: Typecheck (tsc --noEmit)
        run: bun run typecheck

      - name: Lint (eslint)
        run: bun run lint

      - name: Build dist bundles (tools/bundle.js)
        run: bun run build

      - name: Unit specs (bun test, Pyric sandbox)
        env:
          PYRIC_SANDBOX: 1
        run: bun test test/specs/*.spec.js

      - name: Install Playwright Chromium
        run: bun x playwright install --with-deps chromium

      - name: Playwright multi-client e2e specs
        run: bun run test:e2e:playwright

