
name: Pyrepad CI ⚡

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: Build & Test (Bun)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun 🚀
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck TypeScript definitions
        run: bun run typecheck

      - name: Verify ESLint complexity & architecture guardrails
        run: bun run lint

      - name: Build distribution bundles
        run: bun run build

      - name: Verify 102 unit & seam test suites
        env:
          PYRIC_SANDBOX: 1
        run: bun test test/specs/*.spec.js
